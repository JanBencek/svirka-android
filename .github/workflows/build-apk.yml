name: Build

# master → signed release APK published as Svirka.apk; other pushes/PRs → debug compile check.
on:
  push:
  pull_request:
    paths:
      - composeApp/**
      - gradle/**
      - iosApp/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # master = what gets installed: signed, R8-optimised release build (debug
      # builds of Compose apps scroll noticeably worse). Other branches/PRs just
      # compile a debug build. Signing key: repo secrets (backup off-repo).
      - name: Build with Gradle (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.p12
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          RELEASE: true
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          ./gradlew :androidApp:assembleRelease --stacktrace
          rm release.p12

      - name: Build with Gradle (debug)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: svirka-android
          path: androidApp/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: ignore

  publish-release:
    name: Publish Release
    # Rolling release: force-recreated on every push to master so the stable
    # URL always serves the newest APK (raw file, not zip).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: svirka-android
          path: apk

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find apk -name "*.apk" | head -n 1)
          [ -n "$APK" ] || { echo "::error::no APK found in artifact"; exit 1; }
          cp "$APK" Svirka.apk
          # Delete previous release + its tag so the tag can be recreated
          # ('debug' = the old pre-signing debug channel).
          for t in debug build; do gh release delete $t --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; done
          gh release create build Svirka.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Svirka (${GITHUB_SHA::7})" \
            --notes "Signed release APK from master@\`${GITHUB_SHA}\`. Direct install: https://github.com/JanBencek/svirka-android/releases/latest/download/Svirka.apk" \
            --latest
