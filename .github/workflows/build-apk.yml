name: Build

# Fork: builds a debug APK on every push (no signing secrets configured).
on:
  push:
  pull_request:
    paths:
      - composeApp/**
      - gradle/**
      - iosApp/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' && env.SIGNING_KEY_ALIAS
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE: true
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :androidApp:packageRelease --stacktrace
          rm release.keystore

      - name: Build with Gradle (debug)
        id: build_debug
        # Fork behavior: on push without signing secrets, produce a debug APK
        # so every push yields a sideloadable artifact.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !env.SIGNING_KEY_ALIAS)
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: svirka-android
          path: androidApp/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: ignore

  publish-debug-release:
    name: Publish Debug Release
    # Rolling 'debug' release: force-recreated on every push to master so the
    # stable URL always serves the newest APK (raw file, not zip).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: svirka-android
          path: apk

      - name: Publish rolling 'debug' release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find apk -name "*.apk" | head -n 1)
          [ -n "$APK" ] || { echo "::error::no APK found in artifact"; exit 1; }
          cp "$APK" Svirka.apk
          # Delete previous release + its tag so the tag can be recreated.
          gh release delete debug --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create debug Svirka.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Svirka debug build (${GITHUB_SHA::7})" \
            --notes "Auto-built debug APK from master@\`${GITHUB_SHA}\`. Direct install: https://github.com/JanBencek/svirka-android/releases/latest/download/Svirka.apk" \
            --latest
