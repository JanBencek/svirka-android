name: Build

# master → signed release APK published as Svirka.apk; other pushes/PRs → debug compile check.
on:
  push:
  pull_request:
    paths:
      - composeApp/**
      - gradle/**
      - iosApp/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # master = what gets installed: signed, R8-optimised release build (debug
      # builds of Compose apps scroll noticeably worse). Other branches/PRs just
      # compile a debug build. Signing key: repo secrets (backup off-repo).
      - name: Build with Gradle (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.p12
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }} # FCM for Jam invites; unset: no push
          RELEASE: true
          SVIRKA_BUILD: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          ./gradlew :androidApp:assembleRelease --stacktrace
          rm release.p12

      - name: Build with Gradle (debug)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: svirka-android
          path: androidApp/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: ignore

  publish-release:
    name: Publish Release
    # Rolling release: force-recreated on every push to master so the stable
    # URL always serves the newest APK (raw file, not zip).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (with tags, for the release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: svirka-android
          path: apk

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find apk -name "*.apk" | head -n 1)
          [ -n "$APK" ] || { echo "::error::no APK found in artifact"; exit 1; }
          cp "$APK" Svirka.apk
          # Tag build-N, N = this run: the app's update check compares it with its own versionName (androidApp/build.gradle.kts).
          TAG="build-${{ github.run_number }}"
          # Release notes: every commit since the build the previous release was made from (its tag is still there),
          # so a cancelled run's commits aren't lost; the last 20 if there's no previous release.
          OLD=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' | grep -E '^(debug|build)' || true)
          PREV=$(git rev-list -n 1 "$(echo "$OLD" | sort -V | tail -n 1)" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_SHA"; else RANGE="-20 $GITHUB_SHA"; fi
          {
            echo "## What's new"
            git log --no-merges --format='%s' $RANGE \
              | grep -vE '^(chore|ci|build|test|docs|style)(\(.*\))?:' \
              | sed -E 's/^[a-z]+(\(.*\))?: //; s/^/- /' | grep . || echo "- Build and maintenance changes only"
            echo
            echo "Signed release APK from master@\`${GITHUB_SHA}\`. Direct install: https://github.com/JanBencek/svirka-android/releases/latest/download/Svirka.apk"
          } > notes.md
          cat notes.md
          # Only the newest build stays released ('debug' = the old pre-signing debug channel).
          for t in $OLD; do gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true; done
          gh release create "$TAG" Svirka.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Svirka build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            --latest
