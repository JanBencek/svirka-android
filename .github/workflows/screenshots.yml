name: Screenshots

# Manual UI tour: throwaway Navidrome (random password generated in this run,
# seeded with generated tracks) + emulator + Maestro → screenshot artifact.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Seed library + start Navidrome
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null
          .github/screenshots/seed.sh "$PWD/ci-music"
          PW=$(openssl rand -hex 16); echo "::add-mask::$PW"; echo "ND_PASSWORD=$PW" >> "$GITHUB_ENV"
          docker run -d --name navidrome -p 4533:4533 -v "$PWD/ci-music:/music:ro" \
            -e ND_DEVAUTOCREATEADMINPASSWORD="$PW" -e ND_LOGLEVEL=warn deluan/navidrome:0.63.2
          for i in $(seq 60); do curl -sf localhost:4533/ping && break; sleep 2; done
          # wait for the startup scan to index everything
          for i in $(seq 60); do
            n=$(curl -s "localhost:4533/rest/getScanStatus?u=admin&p=$PW&v=1.16.1&c=ci&f=json" | jq -r '."subsonic-response".scanStatus | "\(.scanning) \(.count)"')
            echo "$n"; [ "${n%% *}" = false ] && [ "${n##* }" -gt 0 ] && break; sleep 2
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Emulator tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: androidApp/build/outputs/apk/debug/Svirka.apk
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: .github/screenshots/run.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: shots/**/*.png
          if-no-files-found: warn
