# Maestro UI tour for screenshots. Server + password come from the workflow:
# a throwaway Navidrome on the CI host (10.0.2.2 from the emulator).
appId: com.bencit.svirka.debug
---
- tapOn:
    text: "Wait"
    optional: true
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- takeScreenshot: 01-login
- tapOn: "Clear server"
- inputText: ${SERVER}
- tapOn: "Username"
- inputText: "admin"
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Play"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: 02-songs
- scroll
- takeScreenshot: 03-songs-scrolled
- tapOn: "Playlists"
- waitForAnimationToEnd
- takeScreenshot: 04-playlists
- tapOn: "Library"
- waitForAnimationToEnd
- takeScreenshot: 05-library
- tapOn:
    text: "See all"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 05b-albums
- tapOn:
    text: "Night Drive"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 06-album
- tapOn: "Neon Lights"
- extendedWaitUntil:
    visible: "Aurora Lane"
    timeout: 5000
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- takeScreenshot: 07-album-playing
- scroll
- takeScreenshot: 08-album-scrolled
- scrollUntilVisible:
    element: "Aurora Lane"
    direction: UP
    optional: true
- tapOn:
    text: "Aurora Lane"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 09-artist
- scroll
- takeScreenshot: 10-artist-scrolled
- back
- back
- tapOn: "Import"
- waitForAnimationToEnd
- takeScreenshot: 11-import
- tapOn: "Songs"
- waitForAnimationToEnd
- takeScreenshot: 12-songs-with-player
# mini player sits just above the bottom bar (pixel_6 profile)
- tapOn:
    point: "40%,83%"
- waitForAnimationToEnd
- takeScreenshot: 13-now-playing
- back
- waitForAnimationToEnd
- longPressOn: "Sunčano"
- waitForAnimationToEnd
- takeScreenshot: 14-song-sheet
